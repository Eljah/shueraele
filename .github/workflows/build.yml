name: Build assets, book and honest debug evidence
on:
  push:
    branches: [necrolab-v0.2]
    paths-ignore: ['evidence/**', 'graphics/**', 'spark-import/**', 'book/mini-book.*', 'book/figures/**', 'lab/preview.html', 'docs/TEST_REPORT.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shurale-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libreoffice-writer fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Rebuild originals
        run: |
          mkdir -p evidence book/figures
          python tools/build_assets.py
          python tools/build_script.py
          python tools/build_lab.py
      - name: Test actual sources and render debug screenshots
        run: |
          set -o pipefail
          node --test tests/*.test.cjs | tee evidence/node-tests.tap
          python tests/assets_test.py > evidence/assets-tests.txt 2>&1
          python tests/browser_smoke.py
      - name: Build mini-book and report
        run: |
          python tools/build_book.py --pdf
          python tools/report.py
      - name: Commit generated files, no force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graphics spark-import lab/preview.html book/mini-book.md book/mini-book.docx book/mini-book.pdf book/figures evidence docs/TEST_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "build: generated assets, book and synthetic debug evidence [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shurale-debug-evidence
          path: |
            evidence/
            book/mini-book.pdf
            docs/TEST_REPORT.md
